name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Principio del privilegio minimo: il GITHUB_TOKEN puo' solo leggere il codice.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and Test with Java 21

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw -B -ntp clean test

      # Report JUnit di Surefire
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/

      # Tabella dei test, ordinata per numero del piano, nella pagina della run
      - name: Test summary
        if: always()
        run: python3 .github/scripts/test_summary.py target/surefire-reports

      - name: Build application
        run: ./mvnw -B -ntp package -DskipTests

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: beautyblind-${{ github.sha }}
          path: target/ROOT.war
          retention-days: 30
