name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Principio del privilegio minimo: il GITHUB_TOKEN puo' solo leggere il codice.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and Test with Java 21
    # dorny/test-reporter pubblica i risultati dei test come check: serve solo questo permesso in piu'.
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw -B -ntp clean test

      # Report JUnit di Surefire
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/

      # Tabella dei test, ordinata per numero del piano, nella pagina della run (forse da eliminare)
      - name: Test summary
        if: always()
        run: python3 .github/scripts/test_summary.py target/surefire-reports

      # Lab 4: risultati dei test come check della run e della pull request
      - name: Generate test report
        uses: dorny/test-reporter@v2
        if: success() || failure()
        with:
          name: Maven Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      # Lab 4: report di copertura (target/site/jacoco/jacoco.xml), anche se un test e' fallito
      - name: Generate JaCoCo report
        if: success() || failure()
        run: ./mvnw -B -ntp jacoco:report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/surefire-reports/TEST-*.xml

      # Lab 4: soglie di JaCoCo (righe 80%, branch 75%, classi 100%) sui dati dei test appena eseguiti.
      # Equivale al controllo di "mvn verify", senza rieseguire i test.
      - name: Run JaCoCo quality gates
        run: ./mvnw -B -ntp jacoco:check@check

      # Il mutation testing (PIT) non gira a ogni push: ha un workflow a parte, avviato a mano (mutation.yml).

      - name: Build application
        run: ./mvnw -B -ntp package -DskipTests

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: beautyblind-${{ github.sha }}
          path: target/ROOT.war
          retention-days: 30
